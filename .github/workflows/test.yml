name: tests

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and unzip
        run: sudo apt-get update && sudo apt-get install -y luajit unzip

      - name: Fetch KOReader (default menus)
        run: git clone --depth 1 https://github.com/koreader/koreader.git ../koreader

      - name: Build a real book for page-count checks
        run: |
          git clone --depth 1 https://github.com/standardebooks/f-scott-fitzgerald_the-great-gatsby.git ../gatsby
          mkdir -p ../books
          python3 tools/build_epub.py ../gatsby/src ../books/f-scott-fitzgerald_the-great-gatsby.epub

      - name: Run specs
        env:
          KOREADER_DIR: ../koreader
          SERENO_BOOKS: ../books
        run: luajit spec/run.lua

      - name: Syntax check with LuaJIT
        run: |
          for f in $(find sereno.koplugin tools spec -name '*.lua'); do
            luajit -e "assert(loadfile('$f'))" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Render home screen previews
        env:
          KOREADER_DIR: ../koreader
        run: |
          sudo apt-get install -y librsvg2-bin
          luajit tools/preview.lua previews ../books
          for f in previews/*.svg; do rsvg-convert -o "${f%.svg}.png" "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: home-previews
          path: previews/*.png

      # The home screen and sample reader pages drawn by KOReader's own widget
      # code (Blitbuffer, FreeType, TextBoxWidget, IconWidget...), as a smoke
      # test of the plugin's UI against the current KOReader.
      - name: Render with KOReader's widgets
        env:
          KOREADER_DIR: ${{ github.workspace }}/../koreader
          KORENDER_READER: "1"
        run: |
          sudo apt-get install -y libluajit-5.1-dev imagemagick
          tools/korender/run.sh korender ../books
          ls korender/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: koreader-render
          path: korender/*.png
